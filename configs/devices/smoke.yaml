# SMOKE TEST profile: every stage of the pipeline with tiny settings, fully isolated from the
# real study (own data subset, models, perturbations and results/smoke/). Proves the code runs;
# its numbers mean NOTHING and are never used in the paper.
#   bash scripts/smoke_test.sh
device_label: "Smoke test (tiny settings; code check only)"
platform_class: smoke
runtime: {backend: ort, model_ext: onnx, precision: fp32}
paths:
  coco_images: data/coco128/images/train2017      # 128 COCO images, auto-downloaded (7 MB)
  coco_annotations: data/coco128/none.json        # absent -> image folder is listed instead
  subset_ids: data/subset_smoke/image_ids.txt
  subset_cache: data/subset_smoke/frames_{imgsz}.npy
  models: models_smoke
  perturbations: perturbations_smoke
subset: {n_images: 32, n_attack_train: 32}
model: {name: yolov8n, imgsz: 320}
nms: {device: cpu}
attack: {steps: 20, batch: 4}                     # real study: 300 steps, batch 8
deadline: {fps: 30}
stream: {warmup_frames: 10, closed_frames: 60, open_seconds: 3}
platform: {detector_cores: [0], corunner_cores: [1], cooldown_s: 0, max_start_temp_c: 200}
contention:
  none: {kind: none}
  mem_high: {kind: bw, instances: 1, buffer_mb: 128}
  mem_low: {kind: bw, instances: 1, buffer_mb: 64}
  cpu: {kind: cpu, instances: 1}
experiment:
  blocks:
    E1: {mode: closed, contention: mem_high, runs_per_cell: 2}
    E2: {mode: closed, contention: cpu, runs_per_cell: 2}
    E3: {mode: open, contention: mem_high, runs_per_cell: 2}
analysis: {bootstrap: 300}
